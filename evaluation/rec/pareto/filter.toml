# Controls which points from data_combined/ are shown in the Pareto figures.
# Bounds are inclusive; an empty methods list means all; see plots.py for details.

[display]
pareto_per_method_only = true

[bounds]
lut_min = 0
lut_max = 100000
dsp_min = 0
dsp_max = 1000
rmsre_min = 0.0
rmsre_max = 1.0

[methods]
# Only methods that currently have data under evaluation/rec. Add "Bipartite"
# here once bipartite/data/{accuracy,resources}.csv exist (the generator picks
# it up automatically).
include = ["IP-Core", "Lookup"]
